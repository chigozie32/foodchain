<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | FoodChain Admin</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/components.css">

    <link rel="icon" href="assets/images/logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">

                <img src="../assets/images/logo.png" alt="FoodChain Logo">

                <h2>Reset Password</h2>

                <p>Choose a new password</p>

            </div>

            <form id="resetPasswordForm">

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" id="newPassword" placeholder="New Password" minlength="6" required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" id="confirmPassword" placeholder="Confirm New Password" minlength="6" required>

                </div>

                <button type="submit" class="login-btn" id="resetBtn">

                    Reset Password

                </button>

                <a href="login.html" class="back-to-login-link">

                    ← Back to Login

                </a>

            </form>

        </div>

    </div>

    <script src="js/ui-feedback.js"></script>
    <script src="js/reset-password.js"></script>

</body>

</html>
