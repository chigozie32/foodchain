<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | FoodChain Admin</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/components.css">

    <link rel="icon" href="assets/images/logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">

                <img src="../assets/images/logo.png" alt="FoodChain Logo">

                <h2>Forgot Password</h2>

                <p>We'll email you a reset link</p>

            </div>

            <form id="forgotPasswordForm">

                <p class="login-note">
                    Enter the email address linked to your admin account and we'll
                    send you a link to reset your password.
                </p>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email" id="email" placeholder="Enter Your Email" required>

                </div>

                <button type="submit" class="login-btn" id="sendResetBtn">

                    Send Reset Link

                </button>

                <a href="login.html" class="back-to-login-link">

                    ← Back to Login

                </a>

            </form>

        </div>

    </div>

    <script src="js/ui-feedback.js"></script>
    <script src="js/forgot-password.js"></script>

</body>

</html>
